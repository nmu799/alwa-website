name: Generate Alwa Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: توليد الصفحات
        run: |
          node generate.js
          node sitemap.js

      - name: نسخ ملفات الموقع الرئيسية إلى docs
        run: |
          cp index.html docs/ 2>/dev/null || true
          cp privacy-policy.html docs/ 2>/dev/null || true
          cp terms.html docs/ 2>/dev/null || true
          cp robots.txt docs/ 2>/dev/null || true
          cp -r chat docs/ 2>/dev/null || true
          cp chat-icon.svg docs/ 2>/dev/null || true

          cp *.png docs/ 2>/dev/null || true
          cp *.jpg docs/ 2>/dev/null || true
          cp *.jpeg docs/ 2>/dev/null || true
          cp *.svg docs/ 2>/dev/null || true
          cp *.pdf docs/ 2>/dev/null || true
          cp *.ico docs/ 2>/dev/null || true

      - name: حفظ الملفات المولدة في المستودع
        run: |
          git config user.name "Alwa Bot"
          git config user.email "bot@alwairaq.com"

          git add docs/

          git commit -m "🤖 توليد صفحات عربية وكردية تلقائياً" || echo "لا تغييرات"

          git push

      - name: إصلاح مسارات GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE = "/alwa-website/"

          for file in Path("docs").rglob("*.html"):
              content = file.read_text(encoding="utf-8")

              content = re.sub(
                  r'((?:src|href)=["\'])/(?!/|alwa-website/)',
                  r'\1' + BASE,
                  content
              )

              content = re.sub(
                  r'url\((["\']?)/(?!/|alwa-website/)',
                  r'url(\1' + BASE,
                  content
              )

              file.write_text(content, encoding="utf-8")

          print("✅ تم إصلاح مسارات الصور والأيقونات لـ GitHub Pages")
          PY

      - name: تجهيز GitHub Pages
        uses: actions/configure-pages@v5

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'

      - name: نشر GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

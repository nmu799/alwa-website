name: Generate Alwa Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: توليد الصفحات
        run: |
          node generate.js
          node sitemap.js

      - name: التحقق من وجود index.html
        run: |
          if [ ! -f index.html ]; then
            echo "❌ خطأ: index.html غير موجود في الجذر!"
            exit 1
          fi
          echo "✅ index.html موجود"

      - name: نسخ ملفات الموقع الرئيسية إلى docs
        run: |
          cp index.html docs/ 2>/dev/null || true
          cp privacy-policy.html docs/ 2>/dev/null || true
          cp terms.html docs/ 2>/dev/null || true
          cp *.png docs/ 2>/dev/null || true
          cp *.jpg docs/ 2>/dev/null || true
          cp *.jpeg docs/ 2>/dev/null || true
          cp *.svg docs/ 2>/dev/null || true
          cp *.ico docs/ 2>/dev/null || true

      - name: التحقق من محتوى docs
        run: |
          echo "📂 محتوى docs بعد النسخ:"
          ls -la docs/ | head -30
          test -f docs/index.html && echo "✅ index.html منسوخ بنجاح" || exit 1

      - name: رفع الصفحات للمستودع
        run: |
          git config user.name "Alwa Bot"
          git config user.email "bot@alwairaq.com"
          git add docs/
          git commit -m "🤖 توليد 1270 صفحة تلقائياً" || echo "لا تغييرات"
          git push

      - name: تجهيز GitHub Pages
        uses: actions/configure-pages@v5

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'

      - name: نشر GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

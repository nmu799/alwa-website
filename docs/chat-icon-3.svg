<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- The chat bubble area is transparent -->
    <mask id="cutout">
      <rect width="64" height="64" fill="white"/>
      <path d="M14 25.5
               C14 19.2 19.2 14.5 25.5 14.5
               H38.5
               C44.8 14.5 50 19.2 50 25.5
               V32.5
               C50 38.8 44.8 43.5 38.5 43.5
               H27
               L19 48.5
               L20.8 43.2
               C16.7 41.4 14 37.6 14 32.5 Z"
            fill="black"/>
    </mask>
  </defs>

  <!-- Green 60% base; transparent background -->
  <circle cx="32" cy="32" r="28" fill="#04722b" mask="url(#cutout)"/>

  <!-- Orange 25% -->
  <path d="M8.6 39.8 A28 28 0 0 0 48.5 54"
        fill="none" stroke="#ff6600" stroke-width="5"
        stroke-linecap="round"/>

  <!-- Yellow 15% -->
  <path d="M24.5 6.6 A28 28 0 0 1 55.5 19.5"
        fill="none" stroke="#f1c548" stroke-width="4.5"
        stroke-linecap="round"/>

  <!-- Three green typing dots remain visible -->
  <circle cx="24" cy="29" r="2.2" fill="#04722b"/>
  <circle cx="32" cy="29" r="2.2" fill="#04722b"/>
  <circle cx="40" cy="29" r="2.2" fill="#04722b"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <circle cx="256" cy="256" r="222" fill="#04722b"/>

  <!-- Orange 25% accent -->
  <path d="M75 334 A222 222 0 0 0 424 405 A222 222 0 0 0 459 326"
        fill="none" stroke="#ff6600" stroke-width="34"
        stroke-linecap="round"/>

  <!-- Yellow 15% accent -->
  <path d="M136 105 A222 222 0 0 1 418 137"
        fill="none" stroke="#f1c548" stroke-width="30"
        stroke-linecap="round"/>

  <!-- Main chat bubble -->
  <g filter="url(#shadow)">
    <path d="M112 198
             C112 151 150 119 198 119
             H315
             C363 119 400 151 400 198
             V270
             C400 317 363 349 315 349
             H220
             L159 390
             C153 394 146 389 148 382
             L158 348
             H198
             C150 348 112 317 112 270 Z"
          fill="#ffffff"/>
  </g>

  <!-- Typing dots -->
  <circle cx="203" cy="235" r="16" fill="#04722b"/>
  <circle cx="256" cy="235" r="16" fill="#04722b"/>
  <circle cx="309" cy="235" r="16" fill="#04722b"/>

  <!-- Small secondary bubble -->
  <path d="M300 330
           C300 307 319 291 343 291
           H386
           C410 291 429 307 429 330
           V360
           C429 383 410 399 386 399
           H359
           L337 418
           C334 421 329 418 330 414
           L335 399
           H343
           C319 399 300 383 300 360 Z"
        fill="#ffffff" opacity=".96"/>
</svg>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم علوة نيوز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #04722b; --orange: #ff6600; --bg: #f6f7f9; --ink: #1c1f26; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: var(--primary); margin-top: 0; text-align: center; }
        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-orange { background: var(--orange); }
        .hidden { display: none !important; }
        .article-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .msg { text-align: center; padding: 10px; border-radius: 4px; margin-bottom: 10px; display: none; font-weight: bold; }
        .msg.success { background: #d4edda; color: #155724; display: block; }
        .msg.error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>

    <div id="loginView" class="card">
        <h2>تسجيل الدخول لعلوة نيوز</h2>
        <div id="loginMsg" class="msg"></div>
        <input type="email" id="email" placeholder="البريد الإلكتروني (الإيميل)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button type="button" onclick="login()">دخول</button>
    </div>

    <div id="dashboardView" class="hidden">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <b>مرحباً بك في لوحة تحكم الأخبار</b>
            <button type="button" onclick="logout()" style="width: auto; padding: 5px 15px; background: #dc3545;">خروج</button>
        </div>

        <div class="card">
            <h2>إضافة / تعديل مقال</h2>
            <div id="formMsg" class="msg"></div>
            <input type="hidden" id="articleId">
            <input type="text" id="title" placeholder="عنوان المقال (إلزامي)">
            <input type="text" id="slug" placeholder="رابط المقال (إنجليزي)">
            <textarea id="excerpt" rows="2" placeholder="وصف قصير (Meta Description)"></textarea>
            <textarea id="content" rows="8" placeholder="محتوى المقال (يدعم HTML)"></textarea>
            <label>التصنيف:</label>
            <select id="category"></select>
            <label>صورة رئيسية:</label>
            <input type="file" id="image" accept="image/*">
            <label>الحالة:</label>
            <select id="status">
                <option value="draft">مسودة</option>
                <option value="published">نشر</option>
            </select>
            <button type="button" onclick="saveArticle()" class="btn-orange">حفظ المقال</button>
        </div>

        <div class="card">
            <h2>المقالات الحالية</h2>
            <div id="articlesList">جاري التحميل...</div>
        </div>
    </div>

    <script>
        if (typeof supabase === 'undefined') {
            const msg = document.getElementById('loginMsg');
            msg.innerText = "خطأ: فشل تحميل مكتبة الاتصال. تأكد من اتصالك بالإنترنت وجرب شبكة أخرى.";
            msg.className = 'msg error';
        }

        const SUPABASE_URL = 'https://biaasenkbydtmyqbtvzx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__aROsRno3ozsTymS1KTuGg_yazb3C_U';
        let supabaseClient;
        
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        function showMsg(id, text, type) {
            const el = document.getElementById(id);
            el.innerText = text;
            el.className = 'msg ' + type;
            setTimeout(() => el.style.display = 'none', 5000);
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) return showMsg('loginMsg', 'الرجاء كتابة البريد وكلمة المرور', 'error');
            if(!supabaseClient) return showMsg('loginMsg', 'المكتبة غير محملة، جرب تحديث الصفحة', 'error');

            showMsg('loginMsg', 'جاري الاتصال بالسيرفر...', 'success');
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showMsg('loginMsg', 'خطأ: ' + error.message, 'error');
                } else {
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('dashboardView').classList.remove('hidden');
                    loadCategories();
                    loadArticles();
                }
            } catch (err) {
                showMsg('loginMsg', 'خطأ غير متوقع: ' + err.message, 'error');
            }
        }

        async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

        async function checkSession() {
            if(!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                loadCategories(); loadArticles();
            }
        }

        async function loadCategories() {
            const { data } = await supabaseClient.from('categories').select('*');
            const select = document.getElementById('category');
            select.innerHTML = '<option value="">اختر التصنيف...</option>';
            if (data) data.forEach(c => select.innerHTML += `<option value="${c.id}">${c.name}</option>`);
        }

        async function loadArticles() {
            const { data } = await supabaseClient.from('articles').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('articlesList');
            list.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(a => {
                    list.innerHTML += `
                        <div class="article-item">
                            <div><b>${a.title}</b><br><small style="color:${a.status === 'published' ? 'green' : 'orange'}">${a.status === 'published' ? 'منشور' : 'مسودة'}</small></div>
                            <div><button type="button" onclick="deleteArticle('${a.id}')" style="background:#dc3545; width:auto; padding:5px;">حذف</button></div>
                        </div>`;
                });
            } else { list.innerHTML = 'لا توجد مقالات.'; }
        }

        async function saveArticle() {
            const title = document.getElementById('title').value;
            const slug = document.getElementById('slug').value;
            const content = document.getElementById('content').value;
            const status = document.getElementById('status').value;
            const imageFile = document.getElementById('image').files[0];

            if (!title || !slug || !content) return showMsg('formMsg', 'العنوان، الرابط، والمحتوى إلزامية!', 'error');
            
            showMsg('formMsg', 'جاري الحفظ...', 'success');
            let image_url = null;

            if (imageFile) {
                const fileName = `${Date.now()}.${imageFile.name.split('.').pop()}`;
                const { error: uploadError } = await supabaseClient.storage.from('news-images').upload(fileName, imageFile);
                if (uploadError) return showMsg('formMsg', 'خطأ في الصورة: ' + uploadError.message, 'error');
                image_url = supabaseClient.storage.from('news-images').getPublicUrl(fileName).data.publicUrl;
            }

            const articleData = {
                title, slug, content, status, image_url,
                published_at: status === 'published' ? new Date().toISOString() : null
            };

            const { error } = await supabaseClient.from('articles').insert([articleData]);
            if (error) {
                showMsg('formMsg', 'خطأ في الحفظ: ' + error.message, 'error');
            } else {
                showMsg('formMsg', 'تم الحفظ بنجاح! سيظهر في الموقع بعد دقيقة.', 'success');
                document.getElementById('title').value = '';
                document.getElementById('slug').value = '';
                document.getElementById('content').value = '';
                loadArticles();
            }
        }

        async function deleteArticle(id) {
            if (confirm('حذف المقال؟')) { await supabaseClient.from('articles').delete().eq('id', id); loadArticles(); }
        }

        checkSession();
    </script>
</body>
</html>
